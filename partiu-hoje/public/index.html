<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFC62E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Partiu Hoje?</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: uma coluna de celular (480px). Foto grande no topo de cada card, detalhes embaixo, barra de abas fixa. */
:root{
  --bg:#F2F9FA; --surface:#FFFFFF; --ink:#10282E; --muted:#4A666C; --line:#CFE2E5;
  --accent:#D93A1A; --accent-ink:#FFFFFF; --leaf:#0E7C77; --leaf-soft:#D7EFEC; --warn:#8A5A00; --warn-bg:#FFF1CF;
  --sun:#FFC62E; --sun-ink:#3A2A00; --err:#B3261E; --err-bg:#FDE8E6;
  --c-comer:#C2310F; --c-comer-bg:#FDE6E0; --c-beber:#8A5A00; --c-beber-bg:#FFEFC4; --c-passear:#0B6E69; --c-passear-bg:#D3F0EC;
  --shadow:0 10px 30px rgba(16,40,46,.16);
  /* altura do card: a tela inteira menos topo, filtros, botões e barra de abas, para curtir/passar ficarem sempre à vista */
  --deck-h:clamp(360px,calc(100dvh - 330px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)),660px);
  --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1A1D; --surface:#14272B; --ink:#EAF4F5; --muted:#8FAAB0; --line:#24404A;
  --accent:#FF7A59; --accent-ink:#2A0C04; --leaf:#4FD1C5; --leaf-soft:#123A3A; --warn:#E3B04B; --warn-bg:#3A2D10;
  --sun:#FFD04D; --sun-ink:#3A2A00; --err:#FF8A80; --err-bg:#3B1815;
  --c-comer:#FF8F73; --c-comer-bg:#3B1E17; --c-beber:#F0C060; --c-beber-bg:#3A2D10; --c-passear:#5ADBCF; --c-passear-bg:#123A3A;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1A1D; --surface:#14272B; --ink:#EAF4F5; --muted:#8FAAB0; --line:#24404A;
  --accent:#FF7A59; --accent-ink:#2A0C04; --leaf:#4FD1C5; --leaf-soft:#123A3A; --warn:#E3B04B; --warn-bg:#3A2D10;
  --sun:#FFD04D; --sun-ink:#3A2A00; --err:#FF8A80; --err-bg:#3B1815;
  --c-comer:#FF8F73; --c-comer-bg:#3B1E17; --c-beber:#F0C060; --c-beber-bg:#3A2D10; --c-passear:#5ADBCF; --c-passear-bg:#123A3A;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:max(12px,env(safe-area-inset-top,0px));padding-bottom:calc(100px + env(safe-area-inset-bottom,0px));
  -webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,.card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
.app{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:14px;min-width:0}
.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-family:var(--f-display);font-weight:800;font-size:25px;letter-spacing:-.02em;white-space:nowrap}
.brand .q{display:inline-grid;place-items:center;width:1.1em;height:1.1em;margin-left:.12em;border-radius:50%;background:var(--sun);color:var(--sun-ink);font-size:.85em;line-height:1;vertical-align:.08em}
.locbtn{display:inline-flex;align-items:center;gap:6px;min-width:0;max-width:62%;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;min-height:40px}
.locbtn .ic{font-size:16px;color:var(--accent)}
.locbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sub{color:var(--muted);font-size:14px}
.credit{font-size:12px;color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 18px;font-weight:700;background:var(--accent);color:var(--accent-ink);min-height:48px;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{padding:8px 12px;min-height:40px;border-radius:10px;font-size:14px}
.btn.big{width:100%;font-size:17px;min-height:54px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:500;min-height:40px}
.chip[aria-pressed="true"]{background:var(--sun);border-color:var(--sun);color:var(--sun-ink);font-weight:700}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:20px}
.group{display:flex;flex-direction:column;gap:10px}
.ob{background:var(--sun);color:var(--sun-ink);border-radius:24px;padding:24px 20px;position:relative;overflow:hidden}
.ob::after{content:"";position:absolute;right:-50px;top:-50px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.4);box-shadow:0 0 0 24px rgba(255,255,255,.2)}
.ob>*{position:relative;z-index:1}
.ob h1{font-size:34px;line-height:1.02;font-weight:800;max-width:11em}
.ob p{margin-top:10px;max-width:30em}

/* categorias */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.tile{--tone:var(--c-comer);--tint:var(--c-comer-bg);position:relative;border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:10px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:92px;font-weight:500;font-size:13px;text-align:center;line-height:1.15}
.tile.beber{--tone:var(--c-beber);--tint:var(--c-beber-bg)}
.tile.passear{--tone:var(--c-passear);--tint:var(--c-passear-bg)}
.tile .w{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--tint);color:var(--tone);font-size:26px}
.tile .ck{position:absolute;top:6px;right:6px;font-size:16px;display:none;color:var(--sun-ink)}
.tile[aria-pressed="true"]{background:var(--sun);border-color:var(--sun);color:var(--sun-ink);font-weight:700}
.tile[aria-pressed="true"] .w{background:rgba(255,255,255,.6);color:var(--sun-ink)}
.tile[aria-pressed="true"] .ck{display:block}
input[type=range]{width:100%;accent-color:var(--accent);min-height:32px}
.rangeval{font-family:var(--f-display);font-weight:700}
.field{font:inherit;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg);color:var(--ink);width:100%;min-height:48px;min-width:0}
.row{display:flex;gap:8px;align-items:stretch}

/* filtros e raio na tela de descobrir */
.fscroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-inline:-2px;padding-inline:2px}
.fscroll::-webkit-scrollbar{display:none}
.fchip{display:inline-flex;align-items:center;gap:6px;flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:700;font-size:14px;min-height:40px}
.fchip .ic{font-size:18px}
.fchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

/* card */
.deck{position:relative;height:var(--deck-h);user-select:none;-webkit-user-select:none}
.card{position:absolute;inset:0;background:var(--surface);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;will-change:transform;transition:transform .25s ease}
.card.front{cursor:grab;touch-action:pan-y}
.card.front.drag{transition:none;cursor:grabbing}
.card[data-depth="1"]{transform:scale(.95) translateY(14px)}
.card[data-depth="2"]{transform:scale(.9) translateY(28px)}
.hero{position:relative;flex:0 0 54%;overflow:hidden;background:hsl(var(--h) 55% 30%);color:#fff}
.hero .art{position:absolute;inset:0;display:grid;place-items:center;
  background:radial-gradient(circle at 82% 22%,hsl(var(--h) 80% 70%/.5) 0 16%,transparent 17%),linear-gradient(135deg,hsl(var(--h) 62% 42%),hsl(calc(var(--h) + 24) 58% 28%))}
.hero .art .ic{font-size:92px;opacity:.55;stroke-width:1.4}
.hero img.ph{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:cover;pointer-events:none;-webkit-user-drag:none}
.hero .shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.4) 0,rgba(0,0,0,0) 26%,rgba(0,0,0,0) 44%,rgba(0,0,0,.8) 100%)}
.segs{position:absolute;top:10px;left:12px;right:12px;display:flex;gap:4px;z-index:2}
.segs i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.45)}
.segs i.on{background:#fff}
.tags-top{position:absolute;top:22px;left:12px;right:84px;display:flex;flex-wrap:wrap;gap:6px;z-index:2}
.pill{background:rgba(0,0,0,.5);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;letter-spacing:.04em;color:#fff;backdrop-filter:blur(4px)}
.pill.open{background:#0E7C77}
.pill.closed{background:rgba(120,30,20,.85)}
.match{position:absolute;top:20px;right:12px;width:60px;height:60px;border-radius:50%;background:var(--sun);color:var(--sun-ink);display:grid;place-content:center;text-align:center;font-family:var(--f-display);line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.35);z-index:2}
.match b{font-size:23px;font-weight:800}
.match small{font-size:10px;font-weight:700;margin-top:1px}
.ttl{position:absolute;left:14px;right:14px;bottom:12px;z-index:2}
.ttl h2{font-size:27px;line-height:1.05;font-weight:800;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.55)}
.ttl .meta{font-size:13px;color:rgba(255,255,255,.95);margin-top:4px;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.body{flex:1;min-height:0;overflow:auto;padding:12px 16px 14px;display:flex;flex-direction:column;gap:9px}
.rate{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rate .st{font-family:var(--f-display);font-weight:800;font-size:21px;line-height:1}
.rate .st i{color:#E8A400;font-style:normal}
.rate .n{color:var(--muted);font-size:13px;flex:1;min-width:0}
.maps{display:inline-flex;align-items:center;gap:6px;color:var(--leaf);font-weight:700;font-size:14px;text-decoration:none;border:1.5px solid var(--leaf);border-radius:10px;padding:6px 10px;min-height:38px}
.maps .ic{font-size:16px}
.addr{color:var(--muted);font-size:13px}
.sum{font-size:14px}
.why{background:var(--leaf-soft);border-radius:12px;padding:9px 12px;font-size:14px}
.why ul{margin:4px 0 0;padding-left:18px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--muted)}
.note{font-size:12px;background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:6px 10px}
.stamp{position:absolute;top:84px;padding:4px 12px;border:3px solid;border-radius:10px;font-family:var(--f-display);font-weight:800;font-size:28px;letter-spacing:.04em;opacity:0;transform:rotate(-10deg);pointer-events:none;background:rgba(255,255,255,.92);z-index:3}
.stamp.like{left:16px;color:#0E7C77;border-color:#0E7C77}
.stamp.nope{right:16px;color:#D93A1A;border-color:#D93A1A;transform:rotate(10deg)}
.actions{display:flex;justify-content:center;align-items:center;gap:18px}
.round{width:66px;height:66px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;box-shadow:var(--shadow)}
.round .ic{font-size:30px}
.round.no{color:var(--accent);border-color:var(--accent)}
.round.yes{color:var(--leaf);border-color:var(--leaf)}
.round.undo{width:48px;height:48px;color:var(--muted)}
.round.undo .ic{font-size:21px}
.round:disabled{opacity:.4;cursor:default}

/* carregando, erro, vazio */
.skel{height:var(--deck-h);border-radius:26px;background:var(--surface);border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.skel .a{flex:0 0 54%;background:linear-gradient(100deg,var(--line) 30%,var(--bg) 50%,var(--line) 70%);background-size:220% 100%;animation:sh 1.3s linear infinite;display:grid;place-items:center;color:var(--muted)}
.skel .a .ic{font-size:64px;opacity:.5}
.skel .b{padding:18px 16px;display:flex;flex-direction:column;gap:8px}
.skel .b h2{font-size:22px}
@keyframes sh{to{background-position:-220% 0}}
.notice{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px}
.notice.err{border-color:var(--err);background:var(--err-bg)}
.notice h2{font-size:22px}
.notice.err h2{color:var(--err)}

/* matches */
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px;display:flex;gap:12px;align-items:center}
.thumb{width:84px;height:84px;border-radius:14px;flex:none;position:relative;overflow:hidden;color:#fff;display:grid;place-items:center;background:linear-gradient(135deg,hsl(var(--h) 62% 42%),hsl(calc(var(--h) + 24) 58% 28%))}
.thumb .ic{font-size:34px;opacity:.7}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.item .t{min-width:0;flex:1}
.item h3{font-size:18px;line-height:1.15;font-weight:700}
.item .m{font-size:13px;color:var(--muted)}
.item .go{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}

/* abas */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:5;
  padding:8px max(16px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px))}
.tabs div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tab{border:0;background:transparent;border-radius:12px;padding:8px 4px;font-weight:700;color:var(--muted);min-height:50px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px}
.tab .ic{font-size:22px}
.tab[aria-current="page"]{color:var(--accent);background:var(--leaf-soft)}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;z-index:9;max-width:90vw;text-align:center}

/* lista, notas, janelas, compartilhar */
.round.been{background:var(--sun);border-color:var(--sun);color:var(--sun-ink);flex-direction:column;gap:0;width:72px;height:72px}
.round.been .ic{font-size:26px}.round.been small{font-size:11px;font-weight:700;line-height:1;margin-top:1px}
.actions{gap:12px}
.seg{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px}
.segb{flex:1;border:0;background:transparent;border-radius:10px;padding:9px 6px;font-weight:700;min-height:44px;color:var(--muted)}
.segb[aria-pressed="true"]{background:var(--sun);color:var(--sun-ink)}
.cnt{font-family:var(--f-body);font-weight:500;opacity:.75;font-size:.85em}
.banner{background:var(--leaf-soft);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.st2{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}
.chip-s{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}
.chip-s .ic{font-size:14px}
.chip-s.been{background:var(--leaf-soft);color:var(--leaf)}
.chip-s.want{background:var(--c-comer-bg);color:var(--c-comer)}
.chip-s.mine{background:var(--sun);color:var(--sun-ink)}
.rv2{font-family:var(--f-display);font-size:15px}
.notep{font-size:13px;color:var(--muted);margin-top:6px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.skeltxt{color:var(--muted);font-weight:500}
.stars{display:inline-flex;gap:1px;font-size:17px;line-height:1}
.star{position:relative;display:inline-block;color:var(--line);line-height:1}
.sf{position:absolute;left:0;top:0;overflow:hidden;white-space:nowrap;color:#E8A400}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:8px}
.stepper .stars{font-size:38px}
.sh{position:absolute;top:0;bottom:0;width:50%;border:0;background:transparent;padding:0;margin:0;min-height:0;opacity:0}
.sh.l{left:0}.sh.r{right:0}
.sh:focus-visible{opacity:1;outline:3px solid var(--accent);outline-offset:-2px;background:rgba(255,198,46,.35)}
.row2{display:flex;align-items:center;justify-content:space-between;gap:8px}
body.noscroll{overflow:hidden}
.ov{position:fixed;inset:0;background:rgba(10,25,28,.55);z-index:20;animation:fade .2s ease}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:480px;max-height:90dvh;overflow:auto;background:var(--surface);color:var(--ink);
  border-radius:24px 24px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom,0px));z-index:21;display:flex;flex-direction:column;gap:14px;box-shadow:0 -10px 40px rgba(0,0,0,.3);animation:up .25s ease;outline:none}
.sheet h2{font-size:23px}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
textarea.field{resize:vertical;min-height:84px;line-height:1.4}
.msg{background:var(--err-bg);color:var(--err);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:500}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;text-align:center}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.gbtn{background:#fff;color:#1f1f1f;border:1.5px solid #dadce0}
.gmark{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;font-weight:800;font-family:Arial,sans-serif;color:#4285F4;font-size:19px}
.btn.danger{color:var(--err);border-color:var(--err)}
.btn.danger-solid{background:var(--err);color:#fff}
input.code{font-size:26px;letter-spacing:.3em;text-align:center;font-family:var(--f-display)}
.btn:disabled{opacity:.6;cursor:default}
.fsec{display:flex;flex-direction:column;gap:10px}
a{color:var(--leaf)}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.toast{z-index:30;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.btnrow{display:flex;gap:8px}.btnrow>*{flex:1}
@media (prefers-reduced-motion:reduce){.sheet,.ov{animation:none}}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.card{transition:none}.skel .a{animation:none}}

/* contador de lugares, tela de limite e planos */
.qbar{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 10px 10px 14px;margin:0 0 12px}
.qin{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.qtxt{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px}
.qtxt b{font-weight:800;min-width:0}
.qtier{flex:none;font-size:12px;font-weight:700;color:var(--leaf);background:var(--leaf-soft);border-radius:999px;padding:2px 10px;white-space:nowrap}
.qtrack{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.qtrack i{display:block;height:100%;border-radius:99px;background:var(--leaf);transition:width .3s ease}
.qbar.low .qtrack i{background:var(--accent)}
.qbar>.btn{flex:none}
.paywall{align-items:flex-start}
.pwicon{width:52px;height:52px;border-radius:50%;background:var(--sun);color:var(--sun-ink);display:grid;place-items:center}
.pwicon .ic{font-size:26px}
.pwbtns{display:flex;flex-direction:column;gap:10px;width:100%}
.pwbtns .btn{width:100%}
.plans{display:flex;flex-direction:column;gap:12px}
.plan{border:1.5px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;background:var(--surface)}
.plan.on{border-color:var(--leaf);background:var(--leaf-soft)}
.plan.gold{border-color:var(--sun);box-shadow:inset 0 0 0 1px var(--sun)}
.ptop{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ptop h3{font-size:19px}
.pprice{font-weight:800;font-size:18px}
.pprice small{font-weight:600;color:var(--muted);font-size:13px}
.plan ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.plan li{display:flex;align-items:center;gap:8px;font-size:14px}
.plan li .ic{font-size:16px;color:var(--leaf);flex:none}
.curplan{align-self:flex-start;font-weight:700;font-size:13px;color:var(--leaf);background:var(--leaf-soft);padding:6px 12px;border-radius:999px}
.plan.on .curplan{background:var(--surface)}
.plan .btn{width:100%}
</style>
</head>
