<style>
/* Layout: coluna única estilo app de celular (460px), cartas empilhadas no centro, barra de abas fixa embaixo. */
:root{
  --bg:#F2F9FA; --surface:#FFFFFF; --ink:#10282E; --muted:#4A666C; --line:#CFE2E5;
  --accent:#D93A1A; --accent-ink:#FFFFFF; --leaf:#0E7C77; --leaf-soft:#D7EFEC; --warn:#B7791F;
  --sun:#FFC62E; --sun-ink:#3A2A00;
  --shadow:0 10px 30px rgba(16,40,46,.14);
  --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1A1D; --surface:#14272B; --ink:#EAF4F5; --muted:#8FAAB0; --line:#24404A;
  --accent:#FF7A59; --accent-ink:#2A0C04; --leaf:#4FD1C5; --leaf-soft:#123A3A; --warn:#E3B04B;
  --sun:#FFD04D; --sun-ink:#3A2A00;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1A1D; --surface:#14272B; --ink:#EAF4F5; --muted:#8FAAB0; --line:#24404A;
  --accent:#FF7A59; --accent-ink:#2A0C04; --leaf:#4FD1C5; --leaf-soft:#123A3A; --warn:#E3B04B;
  --sun:#FFD04D; --sun-ink:#3A2A00;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px 96px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:14px;min-width:0}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:-.02em}
.brand .q{display:inline-grid;place-items:center;width:1.1em;height:1.1em;margin-left:.1em;border-radius:50%;background:var(--sun);color:var(--sun-ink);font-size:.85em;line-height:1;vertical-align:.08em}
.demo{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:500;min-height:40px}
.chip[aria-pressed="true"]{background:var(--sun);border-color:var(--sun);color:var(--sun-ink);font-weight:700}
.btn{border:0;border-radius:14px;padding:14px 18px;font-weight:700;background:var(--accent);color:var(--accent-ink);min-height:48px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{padding:8px 12px;min-height:40px;border-radius:10px;font-size:14px}

/* onboarding / profile */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:18px}
.group{display:flex;flex-direction:column;gap:10px}
.hero{background:var(--sun);color:var(--sun-ink);border-radius:22px;padding:22px 18px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-44px;top:-44px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.4);box-shadow:0 0 0 22px rgba(255,255,255,.2)}
.hero>*{position:relative;z-index:1}
.hero h1{font-size:34px;line-height:1.02;font-weight:800;max-width:11em}
.hero p{margin:10px 0 0;max-width:30em}
input[type=range]{width:100%;accent-color:var(--accent);min-height:32px}
.rangeval{font-family:var(--f-display);font-weight:700}

/* deck */
.filters{display:flex;gap:8px;flex-wrap:wrap}
.deck{position:relative;height:clamp(430px,64dvh,560px);touch-action:pan-y;user-select:none}
.card{position:absolute;inset:0;background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;will-change:transform;transition:transform .25s ease}
.card.top{cursor:grab;touch-action:none}
.card.top.drag{transition:none;cursor:grabbing}
.card[data-depth="1"]{transform:scale(.95) translateY(14px)}

.art{height:38%;min-height:130px;position:relative;color:#fff;padding:14px 16px;display:flex;flex-direction:column;justify-content:space-between;

   radial-gradient(circle at 85% 20%,hsl(var(--h) 80% 70%/.55) 0 18%,transparent 19%),
   radial-gradient(circle at 15% 110%,hsl(calc(var(--h) + 30) 70% 35%/.8) 0 38%,transparent 39%),
   linear-gradient(135deg,hsl(var(--h) 62% 40%),hsl(calc(var(--h) + 24) 58% 30%))}
.art.photo{background:linear-gradient(rgba(0,0,0,.12),rgba(0,0,0,.55)),var(--photo) center/cover,hsl(var(--h) 55% 35%)}
.src a{color:inherit;text-decoration:underline;text-underline-offset:2px}
.art .kind{align-self:flex-start;background:rgba(0,0,0,.35);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.art .score{align-self:flex-end;font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1;text-shadow:0 2px 8px rgba(0,0,0,.35)}
.art .score small{font-size:12px;font-weight:500;display:block;text-align:right;opacity:.9}
.art .row{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;min-height:0;overflow:auto}
.body h2{font-size:24px;line-height:1.1;font-weight:800}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;color:var(--muted);font-size:14px}
.meta b{color:var(--ink)}
.src{display:flex;gap:8px;flex-wrap:wrap}
.src span{font-size:13px;border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-variant-numeric:tabular-nums}
.src b{color:var(--ink)}
.why{background:var(--leaf-soft);border-radius:12px;padding:10px 12px;font-size:14px}
.why ul{margin:6px 0 0;padding-left:18px}
.sum{font-size:14px;color:var(--muted);margin:0}
.sum em{font-style:normal;font-weight:700;color:var(--ink)}
.stamp{position:absolute;top:18px;padding:4px 12px;border:3px solid;border-radius:10px;font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:.04em;opacity:0;transform:rotate(-10deg);pointer-events:none;background:rgba(255,255,255,.85)}
.stamp.like{left:16px;color:var(--leaf);border-color:var(--leaf)}
.stamp.nope{right:16px;color:var(--accent);border-color:var(--accent);transform:rotate(10deg)}
.actions{display:flex;justify-content:center;align-items:center;gap:18px}
.round{width:64px;height:64px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;box-shadow:var(--shadow)}
.round svg{width:28px;height:28px}
.round.no{color:var(--accent);border-color:var(--accent)}
.round.yes{color:var(--leaf);border-color:var(--leaf)}
.round.undo{width:48px;height:48px;color:var(--muted)}

.empty h2{color:var(--ink);font-size:24px}

/* matches */
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;gap:12px;align-items:center}
.dot{width:52px;height:52px;border-radius:14px;flex:none;color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:18px;

.item h3{font-size:17px;line-height:1.15;font-weight:700}
.item .m{font-size:13px;color:var(--muted)}
.item .go{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.item a{color:var(--leaf);font-weight:700;font-size:14px;text-decoration:none;border:1.5px solid var(--leaf);border-radius:10px;padding:6px 10px;min-height:36px;display:inline-flex;align-items:center}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:5;
  padding:8px max(16px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px))}
.tabs div{max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tab{border:0;background:transparent;border-radius:12px;padding:8px 4px;font-weight:700;color:var(--muted);min-height:48px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent);background:var(--leaf-soft)}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;z-index:9;max-width:90vw;text-align:center}
/* grupo */
.code{font-family:var(--f-display);font-weight:800;font-size:44px;line-height:1.1;letter-spacing:.18em;background:var(--sun);color:var(--sun-ink);border-radius:16px;padding:4px 14px 4px 22px;display:inline-block}
.field{font:inherit;font-size:22px;letter-spacing:.25em;text-transform:uppercase;text-align:center;border:1.5px solid var(--line);border-radius:12px;padding:10px;background:var(--bg);color:var(--ink);width:100%;min-height:52px}
.mem{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.mem:last-child{border-bottom:0}
.mem span:first-child{min-width:0;overflow-wrap:anywhere}
.mem span:last-child{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.sub{margin:0;color:var(--muted);font-size:14px}
.radius{display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 14px}
.radius label{font-size:14px;color:var(--muted)}
.radius b{color:var(--ink);font-family:var(--f-display);font-size:16px}
.radius input{width:100%;accent-color:var(--accent);min-height:28px}
.credit{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>

];
let P=SAMPLE.map(x=>({...x,id:String(x.id)}));
let LIVE=false;

/* ---------- Estado ---------- */
const KEY="partiu-hoje-v1";
const blank=()=>({onboarded:false,prefs:{likes:[],values:[],diet:[],maxPrice:3,maxDist:10},liked:[],passed:[],w:{},hist:[],tab:"descobrir",types:["comer","passeio"],room:null,saved:{}});

try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(blank(),JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

const brl=n=>"R$".repeat(n);

/* ---------- Pontuação e motivos ---------- */
function rate(p){const a=[p.g,p.t].filter(Boolean);return a.reduce((s,x)=>s+x[0],0)/a.length}
function score(p){
  const pr=S.prefs;let s=50,why=[];
  const lk=p.likes.filter(x=>pr.likes.includes(x));
  if(lk.length){s+=20;why.push("Combina com seu gosto por "+lk[0])}
  const vm=p.tags.filter(x=>pr.values.includes(x));
  if(vm.length){s+=Math.min(18,vm.length*7);why.push("Valores em comum: "+vm.slice(0,3).join(", "))}
  if(p.price<=pr.maxPrice){s+=8;if(p.type==="comer")why.push("Dentro do seu orçamento ("+brl(p.price)+")")}else s-=15;
  if(p.dist<=pr.maxDist){s+=4;why.push("A "+km(p.dist)+" de você")}else s-=12;
  s+=(rate(p)-4)*10;
  let l=0;p.likes.concat(p.tags).forEach(t=>{l+=S.w[t]||0});
  if(Math.abs(l)>0.5){s+=Math.max(-15,Math.min(15,l));if(l>0)why.push("Parecido com o que você curtiu")}
  return {s:Math.max(5,Math.min(99,Math.round(s))),why:why.slice(0,3)}
}
const DRINKISH=new Set(["bares","cerveja preta","cerveja artesanal","drinks","música ao vivo"]);
const dietOK=p=>(LIVE&&p.likes.every(l=>DRINKISH.has(l)))||S.prefs.diet.every(d=>p.diet.includes(d)||(LIVE&&d!=="vegetariano"));
function queue(){
  const done=new Set(S.liked.concat(S.passed));
  return P.filter(p=>!done.has(p.id)&&S.types.includes(p.type)&&(!LIVE||p.dist<=S.prefs.maxDist)&&(p.type!=="comer"||dietOK(p)))
    .map(p=>({p,...score(p)})).sort((a,b)=>b.s-a.s)
}

let DB=null,USER=null,ME=null,canWrite=null,swipes={},NAMES={},unsub=null,syncing=Promise.resolve();

const newCode=()=>Array.from({length:4},()=>CODE_CH[Math.floor(Math.random()*CODE_CH.length)]).join("");

function subscribeRoom(code){
  if(unsub){unsub();unsub=null}

function pushSwipes(){
  if(!DB||!ME||!S.room)return Promise.resolve();
  const code=S.room,body={likes:S.liked.slice(),passes:S.passed.slice(),t:Date.now()};
  syncing=syncing.then(()=>DB.doc("rooms/"+code+"/swipes/"+ME).set(body)).catch(()=>{});

  catch(e){toast("Não foi possível criar a sala")}
}
async function joinRoom(code,skipCheck){
  code=String(code||"").trim().toUpperCase();
  if(!/^[A-Z]{4}$/.test(code)){toast("O código tem 4 letras");return}
  try{
    if(!skipCheck){const d=await DB.doc("rooms/"+code).get();if(!d.exists){toast("Sala não encontrada");return}}
    S.room=code;save();subscribeRoom(code);await pushSwipes();render()
  }catch(e){toast("Não foi possível entrar na sala")}
}

/* ---------- Lugares reais: Google Places (/api/places) e TripAdvisor (/api/tripadvisor) ---------- */
const LIKE_Q={
 "italiana":[["restaurante italiano"],"comer"],
 "brasileira":[["restaurante comida brasileira","restaurante comida caseira"],"comer"],
 "churrasco":[["churrascaria"],"comer"],
 "pizza":[["pizzaria"],"comer"],
 "japonesa":[["restaurante japonês","sushi"],"comer"],
 "chinesa":[["restaurante chinês"],"comer"],
 "oriental":[["restaurante oriental asiático"],"comer"],
 "tailandesa":[["restaurante tailandês"],"comer"],
 "coreana":[["restaurante coreano"],"comer"],
 "árabe":[["restaurante árabe"],"comer"],
 "mexicana":[["restaurante mexicano"],"comer"],
 "frutos do mar":[["restaurante frutos do mar peixes"],"comer"],
 "hambúrguer":[["hamburgueria"],"comer"],
 "vegana":[["restaurante vegano vegetariano"],"comer"],
 "contemporânea":[["restaurante contemporâneo"],"comer"],
 "cafés":[["cafeteria café"],"comer"],
 "padarias":[["padaria confeitaria"],"comer"],
 "bares":[["bar","boteco"],"comer"],
 "cerveja preta":[["cervejaria cerveja preta stout","bar cerveja artesanal stout porter"],"comer"],
 "cerveja artesanal":[["cervejaria artesanal","bar de cerveja artesanal"],"comer"],
 "drinks":[["bar de drinks coquetelaria"],"comer"],
 "sorvete e sobremesas":[["sorveteria gelateria","confeitaria doces sobremesas"],"comer"],
 "música ao vivo":[["bar com música ao vivo"],"comer"],
 "natureza":[["parques trilhas mirantes"],"passeio"],
 "feiras":[["feira gastronômica feira de rua"],"passeio"],
 "oficinas":[["oficina workshop culinária"],"passeio"]};
const DEFAULT_LIKES=["brasileira","bares","cafés","pizza","japonesa","italiana"];
const FALLBACK={lat:-30.0346,lng:-51.2177};
const PRICE={PRICE_LEVEL_FREE:1,PRICE_LEVEL_INEXPENSIVE:1,PRICE_LEVEL_MODERATE:2,PRICE_LEVEL_EXPENSIVE:3,PRICE_LEVEL_VERY_EXPENSIVE:4};
let POS=null,RADIUS=5000,JOBS=[],TA={},TA_OFF=false,loadingMore=false,LOC_NOTE="";
const fmt=n=>n.toFixed(1).replace(".",",");
const where=()=>new Promise(res=>{if(!navigator.geolocation)return res(null);navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lng:p.coords.longitude}),()=>res(null),{timeout:8000,maximumAge:600000})});
function hav(a,b,c,d){const r=x=>x*Math.PI/180,dl=r(c-a),dn=r(d-b);const h=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dn/2)**2;return 2*6371*Math.asin(Math.sqrt(h))}
function hue(s){let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return h}
function srcHTML(p){
  const o=[];
  if(p.g)o.push(`<span>Google <b>${fmt(p.g[0])}</b> (${p.g[1].toLocaleString("pt-BR")})</span>`);
  if(p.t){
    const inner=`TripAdvisor <b>${fmt(p.t[0])}</b> (${p.t[1].toLocaleString("pt-BR")})`;
    o.push(p.taUrl&&/^https:\/\//.test(p.taUrl)?`<span><a href="${esc(p.taUrl)}" target="_blank" rel="noopener">${inner}</a></span>`:`<span>${inner}</span>`)
  }
  return o.join("")
}
function mapPlace(r,pos,like,type){
  const tags=[];
  if(r.allowsDogs)tags.push("pet friendly");
  if(r.outdoorSeating)tags.push("ao ar livre");
  if(r.goodForChildren||r.menuForChildren)tags.push("família");
  if(r.accessibilityOptions&&r.accessibilityOptions.wheelchairAccessibleEntrance)tags.push("acessível");
  const loc=r.location||{};
  return {id:String(r.id),type,name:(r.displayName&&r.displayName.text)||"Sem nome",
    kind:(r.primaryTypeDisplayName&&r.primaryTypeDisplayName.text)||(type==="comer"?"Restaurante":"Passeio"),
    likes:[like],price:PRICE[r.priceLevel]||2,
    dist:loc.latitude!=null?hav(pos.lat,pos.lng,loc.latitude,loc.longitude):99,
    lat:loc.latitude,lng:loc.longitude,
    tags,diet:r.servesVegetarianFood?["vegetariano"]:[],
    g:[r.rating,r.userRatingCount||0],t:null,
    sum:(r.editorialSummary&&r.editorialSummary.text)||r.formattedAddress||"",
    h:hue(r.id),photo:(r.photos&&r.photos[0]&&r.photos[0].name)||null,addr:r.formattedAddress||""}
}
function buildJobs(){
  const sel=S.prefs.likes.filter(l=>LIKE_Q[l]);
  const likes=sel.length?sel:DEFAULT_LIKES,jobs=[];
  for(let i=0;i<2;i++)likes.forEach(l=>{const q=LIKE_Q[l][0][i];if(q)jobs.push({q,like:l,type:LIKE_Q[l][1],token:null,done:false})});
  return jobs.slice(0,14)
}
async function fetchPage(j){
  const u="/api/places?q="+encodeURIComponent(j.q)+"&lat="+POS.lat+"&lng="+POS.lng+"&radius="+RADIUS+(j.token?"&pageToken="+encodeURIComponent(j.token):"");
  const r=await fetch(u);
  if(!r.ok)throw new Error("api");
  const d=await r.json();
  j.token=d.nextPageToken||null;if(!j.token)j.done=true;
  return (d.places||[]).filter(x=>x.rating&&x.id).map(x=>mapPlace(x,POS,j.like,j.type))
}
function merge(list){
  const idx=new Map(P.map(p=>[p.id,p]));
  list.forEach(p=>{const e=idx.get(p.id);if(e){p.likes.forEach(l=>{if(!e.likes.includes(l))e.likes.push(l)})}else{applyTA(p);idx.set(p.id,p);P.push(p)}})
}
async function loadLive(){
  const got=await where();
  POS=got||FALLBACK;
  LOC_NOTE=got?"Usando sua localização atual.":"Sem acesso à sua localização: mostrando perto do centro de Porto Alegre.";
  RADIUS=Math.max(500,Math.min(50000,Math.round(S.prefs.maxDist*1000)));
  JOBS=buildJobs();
  const rs=await Promise.allSettled(JOBS.map(fetchPage));
  const ok=rs.filter(r=>r.status==="fulfilled"&&r.value.length);
  if(!ok.length)return;
  P=[];ok.forEach(r=>merge(r.value));
  LIVE=true;render()
}
async function loadMore(){
  if(loadingMore)return;
  const todo=JOBS.filter(j=>!j.done&&j.token).slice(0,4);
  if(!todo.length)return;
  loadingMore=true;
  const rs=await Promise.allSettled(todo.map(fetchPage));
  rs.forEach(r=>{if(r.status==="fulfilled")merge(r.value)});
  loadingMore=false;
  if(S.tab==="descobrir"&&!document.querySelector(".card.top.drag"))render()
}
function updateSrc(p){const el=document.querySelector('.card[data-id="'+p.id+'"] .src');if(el)el.innerHTML=srcHTML(p)}
function applyTA(p){const m=TA[p.id];if(m&&m.rating){p.t=[m.rating,m.reviews||0];p.taUrl=m.url}}
function enrichTop(){
  if(!LIVE||TA_OFF||S.tab!=="descobrir")return;
  queue().slice(0,3).forEach(o=>{
    const p=o.p;if(p.id in TA||p.lat==null)return;
    TA[p.id]=null;
    fetch("/api/tripadvisor?name="+encodeURIComponent(p.name)+"&lat="+p.lat+"&lng="+p.lng+"&category="+(p.type==="comer"?"restaurants":"attractions"))
      .then(r=>{if(r.status===503){TA_OFF=true;return null}return r.ok?r.json():null})
      .then(j=>{const m=j&&j.match;if(m&&m.rating){TA[p.id]=m;P.forEach(x=>{if(x.id===p.id)applyTA(x)});applyTA(p);updateSrc(p)}})
      .catch(()=>{})
  })
}
function afterRender(){
  enrichTop();
  if(LIVE&&S.tab==="descobrir"&&queue().length<6)loadMore()
}

/* ---------- Ações ---------- */
function decide(id,like){
  const p=byId(id);if(!p)return;
  if(like)S.saved[id]=p;
  (like?S.liked:S.passed).push(id);
  p.likes.concat(p.tags).forEach(t=>{S.w[t]=(S.w[t]||0)+(like?3:-2)});
  S.hist.push({id,like});save();pushSwipes();
  if(like)toast("Salvo em Matches");
  render();
  if(LIVE&&queue().length<8)loadMore()
}
function undo(){
  const h=S.hist.pop();if(!h)return;
  const arr=h.like?S.liked:S.passed;const i=arr.lastIndexOf(h.id);if(i>-1)arr.splice(i,1);
  const p=byId(h.id);if(!p)return;
  p.likes.concat(p.tags).forEach(t=>{S.w[t]=(S.w[t]||0)-(h.like?3:-2)});
  save();pushSwipes();render()
}
function fly(dir){
  const c=document.querySelector(".card.top");if(!c)return;
  c.classList.remove("drag");
  c.style.transform=`translate(${dir*520}px,40px) rotate(${dir*24}deg)`;
  const id=c.dataset.id;
  setTimeout(()=>decide(id,dir>0),220)
}
function bindSwipe(){
  const c=document.querySelector(".card.top");if(!c)return;
  let x0=0,y0=0,dx=0,on=false;
  const ln=c.querySelector(".stamp.like"),nn=c.querySelector(".stamp.nope");
  c.addEventListener("pointerdown",e=>{if(e.target.closest("a"))return;on=true;x0=e.clientX;y0=e.clientY;c.classList.add("drag");try{c.setPointerCapture(e.pointerId)}catch(_){}});
  c.addEventListener("pointermove",e=>{if(!on)return;dx=e.clientX-x0;const dy=(e.clientY-y0)*.25;
    c.style.transform=`translate(${dx}px,${dy}px) rotate(${dx/18}deg)`;
    ln.style.opacity=Math.max(0,Math.min(1,dx/110));nn.style.opacity=Math.max(0,Math.min(1,-dx/110))});
  const end=()=>{if(!on)return;on=false;
    if(Math.abs(dx)>110){fly(dx>0?1:-1)}
    else{c.classList.remove("drag");c.style.transform="";ln.style.opacity=0;nn.style.opacity=0}
    dx=0};
  c.addEventListener("pointerup",end);c.addEventListener("pointercancel",end)
}

/* ---------- Eventos ---------- */
function toggle(arr,v){const i=arr.indexOf(v);i>-1?arr.splice(i,1):arr.push(v)}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab],[data-act],[data-grp]");if(!t)return;
  if(t.dataset.tab){const prev=S.tab;S.tab=t.dataset.tab;save();render();window.scrollTo(0,0);if(prev==="perfil"&&S.tab==="descobrir")loadLive();return}
  if(t.dataset.grp){
    const g=t.dataset.grp,v=t.dataset.v;
    if(g==="likes"||g==="values"||g==="diet")toggle(S.prefs[g],v);
    else if(g==="price")S.prefs.maxPrice=+v;
    else if(g==="type"){toggle(S.types,v);if(!S.types.length)S.types=[v]}
    save();
    if(g==="type")render();
    else{const y=window.scrollY;render();window.scrollTo(0,y)}
    return}
  const a=t.dataset.act;
  if(a==="start"){S.onboarded=true;S.tab="descobrir";save();render();window.scrollTo(0,0);loadLive()}
  else if(a==="yes")fly(1);
  else if(a==="no")fly(-1);
  else if(a==="undo")undo();
  else if(a==="unlike"){const id=t.dataset.id;S.liked=S.liked.filter(x=>x!==id);S.hist=S.hist.filter(h=>h.id!==id);save();pushSwipes();render()}
  else if(a==="reset"){S.liked=[];S.passed=[];S.w={};S.hist=[];save();pushSwipes();render();toast("Aprendizado zerado")}
  else if(a==="create")createRoom();
  else if(a==="join"){const f=$("#joincode");joinRoom(f?f.value:"")}
  else if(a==="leave")leaveRoom();
  else if(a==="copy"){try{navigator.clipboard.writeText(S.room).then(()=>toast("Código copiado")).catch(()=>toast("Código: "+S.room))}catch(_){toast("Código: "+S.room)}}
});
document.addEventListener("input",e=>{
  if(e.target.id==="dist"){S.prefs.maxDist=+e.target.value;$("#distv").textContent=e.target.value+" km";save()}
  else if(e.target.id==="r2"){$("#r2v").textContent=e.target.value+" km"}
});
document.addEventListener("change",e=>{
  if(e.target.id!=="r2")return;
  S.prefs.maxDist=+e.target.value;save();render();
  if(LIVE&&S.prefs.maxDist*1000>RADIUS)loadLive()
});
document.addEventListener("keydown",e=>{
  if(!S.onboarded||S.tab!=="descobrir")return;
  if(e.key==="ArrowRight")fly(1);else if(e.key==="ArrowLeft")fly(-1)
});
render();
if(S.onboarded)loadLive();
(async()=>{
  try{
    if(window.claude&&window.claude.use){
      DB=await window.claude.use("db");USER=await window.claude.use("user");
      if(USER){ME=await USER.id();canWrite=await USER.can("data.write")}
      if(DB&&ME&&S.room)subscribeRoom(S.room)
    }
  }catch(e){}
  if(S.tab==="grupo")render()
})();
</script>
